<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 270" width="100%" height="100%">
  <rect width="680" height="270" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Plane Alpha (bottom) -->
  <polygon points="50,220 130,160 370,160 290,220" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="330" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#1d4ed8">&#945;</text>

  <!-- Plane Beta (intersecting) -->
  <polygon points="90,70 170,10 290,160 210,220" fill="#fef3c7" stroke="#d97706" stroke-width="1.8" opacity="0.8"/>
  <text x="150" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#b45309">&#946;</text>

  <!-- Intersection line d' = alpha cap beta -->
  <line x1="210" y1="220" x2="290" y2="160" stroke="#16a34a" stroke-width="4"/>
  <text x="295" y="180" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#16a34a">d' (giao tuyến)</text>

  <!-- Line d in Beta parallel to Alpha -->
  <line x1="120" y1="70" x2="200" y2="10" stroke="#dc2626" stroke-width="3.5"/>
  <text x="155" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">d // (&#945;)</text>

  <!-- Explanation Box on Right -->
  <rect x="390" y="30" width="265" height="210" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="405" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a">&#11088; ĐỊNH LÍ 2 (Giao tuyến song song):</text>
  
  <text x="405" y="95" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b">&#9679; Cho đường thẳng <tspan font-weight="bold" fill="#dc2626">d // (&#945;)</tspan></text>
  <text x="405" y="125" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b">&#9679; Mặt phẳng <tspan font-weight="bold" fill="#b45309">(&#946;) chứa d</tspan></text>
  <text x="405" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b">&#9679; <tspan font-weight="bold" fill="#16a34a">(&#945;) &#8745; (&#946;) = d'</tspan></text>
  
  <line x1="405" y1="170" x2="635" y2="170" stroke="#e2e8f0" stroke-width="1"/>
  <text x="405" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#15803d">&#10148; KẾT LUẬN: d // d'</text>
  <text x="405" y="220" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">(Giao tuyến luôn song song với d)</text>
</svg>