<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div id="out"></div>
<script>
(async () => {
  const img = new Image();
  img.src = 'assets/images/logo-ths-sang-raw.png';
  await img.decode();

  const w = img.naturalWidth;
  const h = img.naturalHeight;
  const cvs = document.createElement('canvas');
  cvs.width = w;
  cvs.height = h;
  const ctx = cvs.getContext('2d');
  ctx.drawImage(img, 0, 0);
  const spx = ctx.getImageData(0, 0, w, h).data;

  let minX = w, maxX = 0, minY = h, maxY = 0;
  let count = 0;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const diff = Math.max(255 - spx[i], 255 - spx[i+1], 255 - spx[i+2]);
      if (diff > 12) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
        count++;
      }
    }
  }

  const res = {
    w, h, minX, maxX, minY, maxY, count,
    cx: (minX + maxX)/2,
    cy: (minY + maxY)/2,
    R: Math.max((maxX - minX)/2, (maxY - minY)/2)
  };
  document.getElementById('out').innerText = JSON.stringify(res);
})();
</script>
</body>
</html>
