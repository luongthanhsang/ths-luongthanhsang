<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="100%" height="100%">
  <rect width="720" height="300" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Left: General Theorem 1 -->
  <g transform="translate(30, 20)">
    <polygon points="20,200 90,130 250,130 180,200" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="210" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#1d4ed8">&#945;</text>
    
    <!-- Line d' inside alpha -->
    <line x1="60" y1="165" x2="200" y2="165" stroke="#2563eb" stroke-width="3"/>
    <text x="210" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">d'</text>
    <text x="90" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">(d' &#8834; &#945;)</text>

    <!-- Line d outside alpha -->
    <line x1="60" y1="75" x2="200" y2="75" stroke="#dc2626" stroke-width="3.5"/>
    <text x="210" y="75" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">d</text>
    <text x="75" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#64748b">(d &#8836; &#945; và d // d')</text>

    <!-- Conclusion box -->
    <rect x="20" y="215" width="230" height="50" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="35" y="245" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">&#10148; KẾT LUẬN: d // (&#945;)</text>
  </g>

  <!-- Divider -->
  <line x1="320" y1="20" x2="320" y2="280" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Right: Pyramid S.ABCD with Midline MN -->
  <g transform="translate(350, 10)">
    <text x="30" y="25" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#1e3a8a">Ví dụ 1: Hình chóp S.ABCD (M, N là trung điểm SA, SB)</text>
    
    <!-- Pyramid coordinates: S=(160, 40), A=(60, 190), B=(180, 220), C=(300, 190), D=(180, 160) -->
    <!-- Base edges -->
    <line x1="60" y1="190" x2="180" y2="220" stroke="#475569" stroke-width="2"/>
    <line x1="180" y1="220" x2="300" y2="190" stroke="#475569" stroke-width="2"/>
    <line x1="60" y1="190" x2="180" y2="160" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>
    <line x1="180" y1="160" x2="300" y2="190" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Lateral edges -->
    <line x1="160" y1="40" x2="60" y2="190" stroke="#475569" stroke-width="2"/>
    <line x1="160" y1="40" x2="180" y2="220" stroke="#475569" stroke-width="2"/>
    <line x1="160" y1="40" x2="300" y2="190" stroke="#475569" stroke-width="2"/>
    <line x1="160" y1="40" x2="180" y2="160" stroke="#475569" stroke-width="1.5" stroke-dasharray="3 3"/>

    <!-- Midpoints: M on SA = (110, 115), N on SB = (170, 130) -->
    <circle cx="110" cy="115" r="4" fill="#dc2626"/>
    <text x="90" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">M</text>

    <circle cx="170" cy="130" r="4" fill="#dc2626"/>
    <text x="180" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">N</text>

    <!-- Midline MN -->
    <line x1="110" y1="115" x2="170" y2="130" stroke="#dc2626" stroke-width="3.5"/>

    <!-- Vertex Labels -->
    <text x="155" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#1e293b">S</text>
    <text x="45" y="200" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">A</text>
    <text x="180" y="240" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">B</text>
    <text x="310" y="195" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">C</text>
    <text x="185" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">D</text>

    <!-- Result label -->
    <text x="50" y="265" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">&#10004; MN là đường trung bình &#916;SAB &#8658; MN // AB &#8834; (ABCD)</text>
    <text x="50" y="285" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">&#10148; Suy ra: MN // (ABCD) và MN // (SCD)</text>
  </g>
</svg>