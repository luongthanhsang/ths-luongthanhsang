<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 320" width="100%" height="100%">
  <defs>
    <marker id="mGreenW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="mRedW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="mBlueW" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
  </defs>
  <rect width="700" height="320" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>

  <!-- Origin Point O (Mũi tàu M) -->
  <circle cx="120" cy="160" r="7" fill="#15803d" stroke="#ffffff" stroke-width="2"/>
  <text x="95" y="165" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#15803d">M</text>

  <!-- Force F1 (Tàu 1) -->
  <line x1="120" y1="160" x2="300" y2="70" stroke="#dc2626" stroke-width="4" marker-end="url(#mRedW)"/>
  <g>
    <text x="240" y="60" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#dc2626">F<tspan font-size="11" dy="3">1</tspan><tspan dy="-3"> (|F</tspan><tspan font-size="11" dy="3">1</tspan><tspan dy="-3">| = F</tspan><tspan font-size="11" dy="3">0</tspan><tspan dy="-3">)</tspan></text>
    <path d="M 240 48 L 250 48 M 247 45 L 251 48 L 247 51" stroke="#dc2626" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 272 48 L 282 48 M 279 45 L 283 48 L 279 51" stroke="#dc2626" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Force F2 (Tàu 2) -->
  <line x1="120" y1="160" x2="300" y2="250" stroke="#2563eb" stroke-width="4" marker-end="url(#mBlueW)"/>
  <g>
    <text x="240" y="275" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#2563eb">F<tspan font-size="11" dy="3">2</tspan><tspan dy="-3"> (|F</tspan><tspan font-size="11" dy="3">2</tspan><tspan dy="-3">| = F</tspan><tspan font-size="11" dy="3">0</tspan><tspan dy="-3">)</tspan></text>
    <path d="M 240 263 L 250 263 M 247 260 L 251 263 L 247 266" stroke="#2563eb" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 272 263 L 282 263 M 279 260 L 283 263 L 279 266" stroke="#2563eb" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Resultant Force F (Hợp lực) -->
  <line x1="120" y1="160" x2="480" y2="160" stroke="#16a34a" stroke-width="5" marker-end="url(#mGreenW)"/>
  <g>
    <text x="340" y="150" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#16a34a">F  =  F<tspan font-size="11" dy="3">1</tspan><tspan dy="-3">  +  F</tspan><tspan font-size="11" dy="3">2</tspan></text>
    <path d="M 340 137 L 350 137 M 347 134 L 351 137 L 347 140" stroke="#16a34a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 382 137 L 392 137 M 389 134 L 393 137 L 389 140" stroke="#16a34a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 432 137 L 442 137 M 439 134 L 443 137 L 439 140" stroke="#16a34a" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Parallelogram lines -->
  <line x1="300" y1="70" x2="480" y2="160" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="4 4"/>
  <line x1="300" y1="250" x2="480" y2="160" stroke="#16a34a" stroke-width="1.8" stroke-dasharray="4 4"/>

  <!-- Angle labels -->
  <text x="180" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">30&#176;</text>
  <text x="180" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">30&#176;</text>

  <!-- Math conclusion box on right -->
  <rect x="490" y="30" width="195" height="260" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="505" y="65" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#15803d">&#10004; TỔNG KẾT TOÁN HỌC:</text>
  
  <text x="505" y="100" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b">&#9679; Góc lệch đối xứng:</text>
  <text x="515" y="120" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">&#945;&#8321; = &#945;&#8322; = 30&#176;</text>

  <text x="505" y="155" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b">&#9679; Lực kéo bằng nhau:</text>
  <g>
    <text x="515" y="175" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#dc2626">|F<tspan font-size="10" dy="2">1</tspan><tspan dy="-2">| = |F</tspan><tspan font-size="10" dy="2">2</tspan><tspan dy="-2">| = F</tspan><tspan font-size="10" dy="2">0</tspan></text>
    <path d="M 521 164 L 529 164 M 527 162 L 530 164 L 527 166" stroke="#dc2626" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 561 164 L 569 164 M 567 162 L 570 164 L 567 166" stroke="#dc2626" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="505" y="210" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" fill="#1e293b">&#9679; Độ lớn hợp lực:</text>
  <text x="515" y="235" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#16a34a">F = 2&#183;F&#8320;&#183;cos30&#176; = F&#8320;&#8730;3</text>

  <text x="505" y="265" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-style="italic" fill="#475569">&#8594; Tàu đi thẳng vào cảng!</text>
</svg>
