<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="100%" height="100%">
  <rect width="700" height="280" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>

  <!-- Left: Floor and Truss model -->
  <polygon points="40,240 180,180 400,180 260,240" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="180" y="220" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#334155">MẶT SÀN (P)</text>

  <!-- Baseline on floor b in P -->
  <line x1="180" y1="180" x2="400" y2="180" stroke="#2563eb" stroke-width="3"/>
  <text x="270" y="170" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#2563eb">Mép tường b &#8834; (P)</text>

  <!-- Purlin d elevated -->
  <line x1="180" y1="80" x2="400" y2="80" stroke="#0284c7" stroke-width="5"/>
  <text x="270" y="70" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#0284c7">Thanh xà gồ d</text>

  <!-- Vertical distance arrows -->
  <line x1="200" y1="80" x2="200" y2="180" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="380" y1="80" x2="380" y2="180" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="210" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#16a34a">h (khoảng cách không đổi)</text>

  <!-- Right: Rigorous Math Solution -->
  <rect x="420" y="25" width="260" height="230" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
  <text x="435" y="55" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="bold" fill="#15803d">&#10004; GIẢI THÍCH TOÁN HỌC:</text>
  
  <text x="435" y="85" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1e293b">&#9679; Thanh xà gồ <tspan font-weight="bold" fill="#0284c7">d &#8836; (P)</tspan></text>
  <text x="435" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1e293b">&#9679; Mép chân tường <tspan font-weight="bold" fill="#2563eb">b &#8834; (P)</tspan></text>
  <text x="435" y="145" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1e293b">&#9679; Thợ xây gác xà gồ song song mép chân tường: <tspan font-weight="bold" fill="#dc2626">d // b</tspan></text>
  
  <line x1="435" y1="165" x2="665" y2="165" stroke="#e2e8f0" stroke-width="1"/>
  <text x="435" y="190" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="bold" fill="#15803d">&#10148; Theo Định lí 1:</text>
  <text x="445" y="215" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="bold" fill="#0284c7">d // (P) (Xà gồ // Mặt sàn!)</text>
  <text x="435" y="240" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-style="italic" fill="#475569">Mái nhà cân bằng, chịu lực tối ưu.</text>
</svg>